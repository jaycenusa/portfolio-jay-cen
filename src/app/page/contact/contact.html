<section class="page-shell flex min-h-[calc(100vh-5rem)] flex-col justify-center">
  <p class="section-label">// 005 — Contact</p>

  <h1 class="mt-8 max-w-3xl text-[clamp(2.5rem,8vw,5rem)] font-bold tracking-tight text-white">
    Let's build something thoughtful.
  </h1>

  <p class="mt-6 max-w-2xl text-lg leading-relaxed text-neutral-400">
    Open to frontend engineering opportunities, collaborations, and conversations about
    Angular, UX, and quality-driven product work.
  </p>

  <div class="mt-12 flex flex-col gap-4 sm:flex-row sm:flex-wrap">
    @for (link of links; track link.label) {
      <a
        [href]="link.href"
        [attr.target]="link.external ? '_blank' : null"
        [attr.rel]="link.external ? 'noopener noreferrer' : null"
        class="btn-secondary"
      >
        {{ link.label }}
      </a>
    }
  </div>
</section>
