<div class="site-shell">
  <nav class="site-nav">
    <div class="site-nav__inner">
      <a
        routerLink="/"
        fragment="about"
        class="site-nav__brand"
        aria-label="Jay Cen logo"
        (click)="closeMenu()"
      >
        <img
          src="images/JC-logo.png"
          alt="JC Logo"
          class="site-nav__logo"
        />
      </a>

      <div class="site-nav__links">
        @for (item of navItems; track item.fragment) {
          <a
            routerLink="/"
            [fragment]="item.fragment"
            routerLinkActive="site-nav__link--active"
            [routerLinkActiveOptions]="fragmentActiveOptions"
            class="site-nav__link"
          >
            {{ item.label }}
          </a>
        }
      </div>

      <button
        type="button"
        class="site-nav__menu-toggle"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-nav"
        aria-label="Toggle menu"
        (click)="toggleMenu()"
      >
        <span class="site-nav__menu-bar" [class.site-nav__menu-bar--open-top]="menuOpen"></span>
        <span class="site-nav__menu-bar" [class.site-nav__menu-bar--hidden]="menuOpen"></span>
        <span class="site-nav__menu-bar" [class.site-nav__menu-bar--open-bottom]="menuOpen"></span>
      </button>
    </div>

    @if (menuOpen) {
      <div id="mobile-nav" class="site-nav__mobile">
        @for (item of navItems; track item.fragment) {
          <a
            routerLink="/"
            [fragment]="item.fragment"
            routerLinkActive="site-nav__link--active"
            [routerLinkActiveOptions]="fragmentActiveOptions"
            class="site-nav__mobile-link"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
      </div>
    }
  </nav>

  <main class="site-shell__main">
    <router-outlet />
  </main>
</div>
