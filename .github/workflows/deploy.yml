name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue Pages deploys; do not cancel in-progress runs — cancellation can wedge
# GitHub Pages deployments and leave later deploys stuck indefinitely.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      should_tag: ${{ steps.version.outputs.should_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag from conventional commits
        id: version
        run: |
          set -euo pipefail

          git fetch --tags --force

          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            CURRENT="${LAST_TAG#v}"
          else
            RANGE="HEAD"
            CURRENT="0.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT}"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          BUMP="none"
          COMMITS=$(git log "$RANGE" --pretty=format:%s --no-merges)

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue

            if [[ "$msg" =~ ^feat(\([a-zA-Z0-9_-]+\))?!: ]] || [[ "$msg" =~ ^feat(\([a-zA-Z0-9_-]+\))?: ]] || [[ "$msg" =~ ^feat! ]]; then
              BUMP="minor"
            elif [[ "$msg" =~ ^fix(\([a-zA-Z0-9_-]+\))?!: ]] || [[ "$msg" =~ ^fix(\([a-zA-Z0-9_-]+\))?: ]] || [[ "$msg" =~ ^fix! ]]; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
              fi
            elif [[ "$msg" =~ ^chore(\([a-zA-Z0-9_-]+\))?: ]]; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
              fi
            fi
          done <<< "$COMMITS"

          if [ "$BUMP" = "none" ]; then
            echo "No feat, fix, or chore commits found since ${LAST_TAG:-the first commit}. Skipping tag."
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$BUMP" in
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Creating tag ${NEW_TAG} (${BUMP} bump from ${CURRENT})"
          echo "should_tag=true" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Push version tag
        if: steps.version.outputs.should_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

  build:
    needs: version
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set base href
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "BASE_HREF=/" >> "$GITHUB_ENV"
          else
            echo "BASE_HREF=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build -- --base-href "$BASE_HREF"

      - name: Configure SPA fallback for GitHub Pages
        run: cp dist/portfolio-jay-cen/browser/index.html dist/portfolio-jay-cen/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-jay-cen/browser

  deploy:
    needs: [build, version]
    if: always() && needs.build.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Log release version
        if: needs.version.outputs.should_tag == 'true'
        run: echo "Deployed release ${{ needs.version.outputs.new_tag }}"
