<section class="section-block">
  <p class="section-label">// 003 — Projects</p>
  <h1 class="section-heading">Selected work</h1>

  <div class="project-list">
    @for (project of projects; track project.id) {
      <a
        class="project-row"
        [href]="project.previewUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        <p class="project-row__index">{{ project.id }}</p>

        <div class="project-row__body">
          <div class="project-row__header">
            <h2 class="project-row__title">{{ project.name }}</h2>
            <div class="project-row__meta">
              <span class="project-row__year">{{ project.year }}</span>
              <span class="project-row__arrow" aria-hidden="true">↗</span>
            </div>
          </div>

          <p class="project-row__description">{{ project.description }}</p>

          <div class="project-row__tags">
            @for (tag of project.tags; track tag) {
              <span class="tag-pill">{{ tag }}</span>
            }
          </div>
        </div>
      </a>
    }
    <div class="project-list__end"></div>
  </div>
</section>
