<div class="flex min-h-screen flex-col bg-white">
  <nav class="grid grid-cols-3 items-center border-b border-gray-200 px-8 py-4">
    <a routerLink="/logo" class="justify-self-start">
      <img
        src="images/JC-logo.png"
        alt="JC Logo"
        class="h-20 w-auto"
      />
    </a>

    <div class="flex flex-nowrap justify-center gap-8">
      <a
        routerLink="/"
        routerLinkActive="bg-gray-100 text-gray-900"
        [routerLinkActiveOptions]="{ exact: true }"
        class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50 hover:text-gray-900"
      >
        About Me
      </a>
      <a
        routerLink="/achievements"
        routerLinkActive="bg-gray-100 text-gray-900"
        class="rounded-full px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50 hover:text-gray-900"
      >
        Achievements
      </a>
      <a
        routerLink="/projects"
        routerLinkActive="bg-gray-100 text-gray-900"
        class="rounded-full px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50 hover:text-gray-900"
      >
        Projects
      </a>
      <a
        routerLink="/contact"
        routerLinkActive="bg-gray-100 text-gray-900"
        class="rounded-full px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50 hover:text-gray-900"
      >
        Contact
      </a>
    </div>
    <div class="justify-self-end">
      <button
        type="button"
        class="rounded-full border border-gray-900 bg-gray-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-gray-800"
      >
        Login
      </button>
    </div>
  </nav>

  <main class="flex-1">
    <router-outlet />
  </main>
</div>
